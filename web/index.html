<!doctype html>
<meta charset="utf-8">
<title>sapf web</title>
<style>
  body { font: 14px ui-monospace, monospace; margin: 16px; max-width: 900px; }
  #controls label { display: grid; grid-template-columns: 8em 1fr 6em; gap: 8px; align-items: center; margin: 4px 0; }
  pre { background: #f4f4f4; padding: 8px; height: 280px; overflow: auto; white-space: pre-wrap; }
</style>
<h3>sapf (wasm spike)</h3>
<p>Ctrl/Cmd+Enter evaluates the selection or the current line, Shift+Enter the enclosing ( ) block,
Ctrl/Cmd+Shift+Enter the paragraph. Esc or Ctrl/Cmd+. stops sound, Ctrl/Cmd+Shift+. clears the stack,
Shift+Alt+F formats. Hover a word for its documentation. <a href="https://github.com/victorkashirin/sapf-web">Source</a> (GPL-3.0)</p>
<script type="text/plain" id="example">440 0 sinosc .3 * play
stop
[300 301] 0 sinosc 8 0 lfsaw .5 * * play
"freq" 100 2000 440 xslider 0 sinosc "amp" 0 1 .3 slider * play
</script>
<div id="code"></div>
<p><button id="run">Run</button> <button id="stop">Stop</button> <button id="addSlider">Add slider</button></p>
<div id="controls"></div>
<pre id="log"></pre>
<script type="module">

const log = document.getElementById('log');
const print = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
import createSapf from './build/sapf.mjs';
import { createEditor, lineAt } from './build/editor.js';

// Code is evaluated on a wasm pthread and audio renders in a Wasm Audio Worklet; both share
// memory, which needs cross-origin isolation (serve with web/serve.py).
if (!crossOriginIsolated) print('This page needs cross-origin isolation (COOP/COEP headers). Serve it with web/serve.py.');
const sapfReady = createSapf({ print, printErr: print });
let sapf, ctx;

// `slider` / `xslider` (sapf_web.cpp) call this each time they run: one row per name, kept across runs.
const controls = document.getElementById('controls'), rows = [];
const fmt = v => String(+v.toPrecision(4));
function onSapfSlider(id, name, lo, hi, value, exp) {
  let row = rows[id];
  // Same range: sapf left the value alone, and `value` may predate a drag in flight.
  if (row && row.range === `${lo} ${hi} ${exp}`) return;
  if (!row) {
    row = rows[id] = document.createElement('label');
    row.innerHTML = '<span></span><input type="range" min="0" max="1" step="any"><output></output>';
    controls.append(row);
  }
  const [label, input, output] = row.children;
  const toValue = p => exp ? lo * (hi / lo) ** p : lo + p * (hi - lo);
  const toPos = v => hi === lo ? 0 : exp ? Math.log(v / lo) / Math.log(hi / lo) : (v - lo) / (hi - lo);
  row.range = `${lo} ${hi} ${exp}`;
  label.textContent = name;
  input.value = toPos(value);
  output.textContent = fmt(value);
  input.oninput = () => { const v = toValue(+input.value); output.textContent = fmt(v); sapf._sapf_set_ctl(id, v); };
}

async function boot() {
  if (ctx) return;
  sapf = await sapfReady;
  sapf.onSapfSlider = onSapfSlider;
  ctx = sapf.emscriptenGetAudioObject(sapf.ccall('sapf_start_audio', 'number', ['string'], ['sapf-prelude.txt']));
  window.sapf = sapf; window.sapfCtx = ctx; // for debugging in devtools
}


async function run(src) {
  await boot();
  await ctx.resume();
  print('> ' + src.trim());
  sapf.ccall('sapf_eval', null, ['string'], [src + '\n']);
}

const editor = createEditor(document.getElementById('code'), document.getElementById('example').textContent, run);
document.getElementById('run').onclick = () => {
  const { from, to } = editor.state.selection.main;
  run(lineAt(editor.state.doc.toString(), from, to).code);
};
document.getElementById('stop').onclick = () => run('stop');
// Inserts a slider definition on a new line above the cursor's line and runs it.
// A function, not a stored signal: each use reads the slider afresh.
document.getElementById('addSlider').onclick = () => {
  let n = 1;
  const text = editor.state.doc.toString();
  while (text.includes(`"ctl${n}"`) || rows.some(r => r.firstChild.textContent === `ctl${n}`)) ++n;
  const line = `\\["ctl${n}" 0 1 .5 slider] = ctl${n}`;
  const at = editor.state.doc.lineAt(editor.state.selection.main.head).from;
  editor.dispatch({ changes: { from: at, insert: line + '\n' }, selection: { anchor: at + line.length } });
  editor.focus();
  run(line);
};
</script>
